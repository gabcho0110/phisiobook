* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }

/* ===== LOGIN ===== */

.code-inputs { display: flex; justify-content: center; gap: 8px; margin-bottom: 1rem; }
.code-inputs input { width: 45px; height: 55px; font-size: 1.4rem; font-weight: 700; text-align: center; border: 2px solid #cfddee; border-radius: 12px; color: #0b2b4f; background: #f8fbfe; font-family: 'Courier New', monospace; }

.login-btn { width: 100%; padding: 0.8rem; border: none; border-radius: 40px; background: #0b2b4f; color: #ffffff; font-size: 0.95rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.2s, opacity 0.2s; }
.login-btn:hover:not(:disabled) { background: #1e4a78; }

/* ===== APP ===== */

/* ===== SIDEBAR ===== */

/* ===== MAIN ===== */
.main { flex: 1; background-color: #f8fbfe; padding: 1.5rem 2rem; overflow-y: auto; width: 100%; max-width: 100vw; overflow-x: hidden; }
.module { display: none; animation: fade 0.2s ease; }
.module.active { display: block; }
@keyframes fade { from { opacity: 0.5; } to { opacity: 1; } }
.module-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
.module-header h1 { font-size: 1.6rem; font-weight: 500; color: #0b2b4f; display: flex; align-items: center; gap: 10px; }
.module-header h1 i { color: #1e4a78; }/* ===== DASHBOARD ===== */
.dash-top-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }

.dash-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.8rem; }

.dash-section { background: #ffffff; border-radius: 16px; padding: 1.2rem 1.5rem; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.04); border: 1px solid #e9eef3; margin-bottom: 1.2rem; }

.dash-list-item .time-box { background: #ffffff; border-radius: 8px; padding: 0.3rem 0.6rem; font-weight: 700; color: #1e4a78; font-size: 0.85rem; min-width: 55px; text-align: center; border: 1px solid #cfddee; flex-shrink: 0; }
.dash-list-item .info { flex: 1; min-width: 0; }

/* ===== CARDS & FORMS ===== */
.card { background: #ffffff; border-radius: 20px; padding: 1.5rem 1.8rem; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.04); border: 1px solid #e9eef3; margin-bottom: 1.5rem; }

/* ===== PATIENT TABS ===== */

.patient-pane.active { display: block; }
.profile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.6rem; }

.profile-field-label { font-size: 0.7rem; font-weight: 700; color: #7f95b0; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; display: flex; align-items: center; gap: 4px; }

/* ===== BUTTONS ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0.7rem 1.5rem; border-radius: 40px; border: none; font-weight: 600; font-size: 0.9rem; cursor: pointer; background-color: #0b2b4f; color: #ffffff; box-shadow: 0 6px 14px rgba(11, 43, 79, 0.15); white-space: nowrap; }

/* ===== TABLES ===== */
.table-wrapper { overflow-x: auto; border-radius: 16px; border: 1px solid #e9eef3; background: #ffffff; -webkit-overflow-scrolling: touch; max-width: 100%; }

.filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.8rem; }
.code-badge { display: inline-flex; align-items: center; gap: 6px; background: #e8f0fe; color: #0b2b4f; padding: 0.3rem 0.7rem; border-radius: 8px; font-family: 'Courier New', monospace; font-weight: 700; font-size: 0.9rem; letter-spacing: 1px; }

/* ===== PROFILE ===== */
.patient-profile { display: none; }
.patient-profile.active { display: block; }
.back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 0.5rem 1rem; border: 1px solid #cfddee; border-radius: 40px; background: transparent; color: #0b2b4f; font-weight: 500; cursor: pointer; margin-bottom: 1.2rem; font-size: 0.85rem; }
.back-btn:hover { background: #f5f9ff; }
.profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 1.5rem; padding: 1.5rem 1.8rem; background: linear-gradient(135deg, #0b2b4f 0%, #1e4a78 100%); border-radius: 20px; color: #ffffff; }
.profile-avatar { width: 70px; height: 70px; border-radius: 50%; background: #ffffff; color: #0b2b4f; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; flex-shrink: 0; }
.profile-info h2 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.3rem; }
.profile-info .contact { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.85rem; color: #c8ddf0; }
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.8rem; margin-bottom: 1.5rem; }
.stat-card { background: #ffffff; border: 1px solid #e9eef3; border-radius: 16px; padding: 1rem 1.2rem; }
.stat-card .label { font-size: 0.75rem; color: #7f95b0; text-transform: uppercase; margin-bottom: 0.3rem; }
.stat-card .value { font-size: 1.4rem; font-weight: 700; color: #0b2b4f; }
.timeline { position: relative; padding-left: 25px; }
.timeline::before { content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: #e9eef3; }
.timeline-item { position: relative; padding: 1rem 1.2rem; background: #ffffff; border: 1px solid #e9eef3; border-radius: 14px; margin-bottom: 0.8rem; }
.timeline-item::before { content: ''; position: absolute; left: -23px; top: 1.2rem; width: 10px; height: 10px; border-radius: 50%; background: #1e4a78; border: 3px solid #ffffff; box-shadow: 0 0 0 3px #e8f0fe; }
.timeline-item .date { font-size: 0.8rem; color: #1e4a78; font-weight: 600; margin-bottom: 0.3rem; }
.timeline-item .title { font-size: 0.95rem; font-weight: 600; color: #0b2b4f; margin-bottom: 0.4rem; }
.timeline-item .result { font-size: 0.85rem; color: #5a7a9a; background: #f8fbfe; padding: 0.6rem 0.8rem; border-radius: 8px; border-left: 3px solid #1e4a78; margin-top: 0.5rem; }

/* ===== SCHEDULE ===== */
.schedule-view-tabs { display: flex; gap: 6px; margin-bottom: 1.2rem; flex-wrap: wrap; align-items: center; }
.schedule-view-tab { padding: 0.6rem 1.1rem; border-radius: 10px; border: 2px solid #cfddee; background: #fff; color: #1f3f61; font-weight: 600; font-size: 0.82rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }

.week-nav { display: flex; align-items: center; gap: 8px; }

.day-column { background: #ffffff; border-radius: 14px; overflow: hidden; min-height: 350px; display: flex; flex-direction: column; border: 1px solid #e9eef3; }

.day-header { padding: 0.6rem 0.5rem; background: #ffffff; border-bottom: 1px solid #e9eef3; text-align: center; }
.day-column.today .day-header { background: #1e4a78; color: #ffffff; }

.day-header .day-number { font-size: 1.1rem; font-weight: 700; color: #0b2b4f; margin-top: 0.1rem; }

.day-body { padding: 0.5rem; display: flex; flex-direction: column; gap: 5px; flex: 1; }
.day-body.drop-target { background: #e8f0fe; border: 2px dashed #1e4a78; }
.appointment { background: #ffffff; border: 1px solid #cfddee; border-left: 4px solid #1e4a78; border-radius: 8px; padding: 0.5rem 0.6rem; font-size: 0.78rem; cursor: grab; position: relative; transition: 0.15s; user-select: none; }

.appointment.status-confirmed { border-left-color: #1a7a3e; background: #f5fff8; }

.apt-status-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 0.6rem; font-weight: 700; padding: 1px 4px; border-radius: 4px; text-transform: uppercase; margin-top: 2px; }
.apt-status-badge.pending { background: #fff5e5; color: #b06d00; }

.apt-status-badge.substitution { background: #f0e8ff; color: #6b3fa0; }
.apt-recurrence-badge { display: inline-flex; align-items: center; gap: 2px; font-size: 0.6rem; font-weight: 600; padding: 1px 4px; border-radius: 4px; background: #f0e8ff; color: #6b3fa0; margin-top: 2px; margin-left: 2px; }
.blocked-time { background: repeating-linear-gradient(45deg, #f5f5f5, #f5f5f5 10px, #e8e8e8 10px, #e8e8e8 20px); border-left: 4px solid #7f7f7f; padding: 0.5rem 0.6rem; border-radius: 8px; font-size: 0.78rem; color: #666; font-weight: 600; }

.blocked-time.vacation { border-left-color: #6b3fa0; background: repeating-linear-gradient(45deg,#f9f5ff,#f9f5ff 10px,#f0e8ff 10px,#f0e8ff 20px); }
.month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: #fff; border-radius: 14px; padding: 0.8rem; border: 1px solid #e9eef3; }

/* ===== PRICING ===== */
.price-date-bar { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; background: linear-gradient(135deg, #0b2b4f 0%, #1e4a78 100%); padding: 1.2rem 1.5rem; border-radius: 16px; color: #ffffff; margin-bottom: 1.2rem; }

.day-summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.8rem; margin-top: 1.2rem; }

/* ===== EXERCISES ===== */

.short-actions { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 1rem; }
.media-preview-box { border: 2px dashed #cfddee; border-radius: 12px; padding: 0.8rem; background: #f8fbfe; min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #7f95b0; font-size: 0.85rem; text-align: center; }

.exercise-body { padding: 1rem 1.2rem; flex: 1; display: flex; flex-direction: column; }

.chat-view { flex: 1; display: none; flex-direction: column; overflow: hidden; }
